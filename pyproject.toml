[build-system]
requires = ["setuptools>=77.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md_converter"
version = "1.0.0"
description = "Markdown to DOCX Converter with compiler architecture"
readme = "README.md"
license = "MIT"
authors = [
    {name = "MD Converter Team", email = "support@mdconverter.io"}
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "markdown-it-py>=3.0.0",
    "python-docx>=0.8.10",
    "pyyaml>=5.0",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
mermaid = ["playwright==1.62.0"]
dev = [
    "black>=23.0.0",
    "build>=0.10.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.0",
    "twine>=4.0.0",
]

[project.scripts]
md-converter = "md_converter.cli:main"
md-converter-check = "md_converter.cli:check_dependencies"
md-converter-release-evidence = "md_converter.cli:release_evidence"

[project.entry-points."md_converter.passes"]
normalize = "md_converter.pipeline.passes.normalize_pass:NormalizePass"
diagram = "md_converter.pipeline.passes.diagram_pass:DiagramPass"

[project.entry-points."md_converter.themes"]
default = "md_converter.renderer.themes.v15_theme:V15Theme"
v1_5 = "md_converter.renderer.themes.v15_theme:V15Theme"
github = "md_converter.renderer.themes.default:get_github_theme"
academic = "md_converter.renderer.themes.default:get_academic_theme"
corporate = "md_converter.renderer.themes.default:get_corporate_theme"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["md_converter*"]

[tool.setuptools.package-data]
md_converter = ["py.typed", "renderer/themes/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["md_converter/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "golden: Golden test for regression testing",
    "slow: Slow running test",
    "integration: Integration test",
    "unit: Unit test",
]

[tool.coverage.run]
source = ["md_converter"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 85
